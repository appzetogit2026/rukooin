# ============================================================
# NGINX CONFIGURATION — Add inside your server {} block
# File: /etc/nginx/sites-available/rukkoo.in (or your config)
# ============================================================

# Serve locally uploaded files (new uploads go here)
location /uploads/ {
    # Actual path where Node.js saves uploaded files
    # Make sure PM2/Node process has WRITE access here
    # and the nginx user (www-data) has READ access
    alias /root/rukooin/RukkooIn/backend/uploads/;

    # CORS: Allow your frontend domain to load images
    add_header Access-Control-Allow-Origin "https://rukkoo.in";
    add_header Access-Control-Allow-Methods "GET, OPTIONS";

    # Aggressive caching for static assets (30 days)
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";

    # Disable access logging to save disk I/O
    access_log off;

    # Security: don't expose directory listings
    autoindex off;
}


# ============================================================
# PERMISSIONS SETUP (Run once on VPS as root/sudo)
# ============================================================
#
# 1. Create the uploads directory if it doesn't exist:
#    mkdir -p /var/www/rukkoo/backend/uploads
#
# 2. Give Node.js (PM2) write access:
#    chown -R www-data:www-data /var/www/rukkoo/backend/uploads
#    chmod -R 775 /var/www/rukkoo/backend/uploads
#
# 3. Verify nginx user can read:
#    ls -la /var/www/rukkoo/backend/uploads
#
# 4. After adding the block, test nginx config:
#    nginx -t
#
# 5. Reload nginx:
#    systemctl reload nginx
#
# ============================================================
# NOTE: The BASE_URL in backend/.env must match your API domain
# Currently set to: https://api.rukkoo.in
# ============================================================
